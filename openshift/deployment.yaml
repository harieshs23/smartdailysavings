apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smartdailysavings-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartdailysavings-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartdailysavings-postgres
  template:
    metadata:
      labels:
        app: smartdailysavings-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: smartdailysavings
            - name: POSTGRES_USER
              value: smartdailysavings
            - name: POSTGRES_PASSWORD
              value: smartdailysavings
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: smartdailysavings-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: smartdailysavings-postgres
spec:
  selector:
    app: smartdailysavings-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartdailysavings-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartdailysavings-redis
  template:
    metadata:
      labels:
        app: smartdailysavings-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--appendonly", "yes"]
---
apiVersion: v1
kind: Service
metadata:
  name: smartdailysavings-redis
spec:
  selector:
    app: smartdailysavings-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartdailysavings-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: smartdailysavings-backend
  template:
    metadata:
      labels:
        app: smartdailysavings-backend
    spec:
      securityContext:
        fsGroup: 1012830000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: backend
          image: ghcr.io/harieshs23/smartdailysavings-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: DATABASE_URL
              value: postgresql://smartdailysavings:smartdailysavings@smartdailysavings-postgres:5432/smartdailysavings
            - name: CELERY_BROKER_URL
              value: redis://smartdailysavings-redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://smartdailysavings-redis:6379/0
            - name: MODEL_PROVIDER
              value: openai
---
apiVersion: v1
kind: Service
metadata:
  name: smartdailysavings-backend
spec:
  selector:
    app: smartdailysavings-backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartdailysavings-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartdailysavings-frontend
  template:
    metadata:
      labels:
        app: smartdailysavings-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/harieshs23/smartdailysavings-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: smartdailysavings-frontend
spec:
  selector:
    app: smartdailysavings-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: smartdailysavings-frontend
spec:
  to:
    kind: Service
    name: smartdailysavings-frontend
  port:
    targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: smartdailysavings-backend
spec:
  to:
    kind: Service
    name: smartdailysavings-backend
  port:
    targetPort: http
