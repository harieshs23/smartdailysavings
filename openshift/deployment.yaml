apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartdailysavings-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartdailysavings-backend
  template:
    metadata:
      labels:
        app: smartdailysavings-backend
    spec:
      containers:
        - name: backend
          image: docker.io/your-dockerhub-username/smartdailysavings-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
---
apiVersion: v1
kind: Service
metadata:
  name: smartdailysavings-backend
spec:
  selector:
    app: smartdailysavings-backend
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartdailysavings-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartdailysavings-frontend
  template:
    metadata:
      labels:
        app: smartdailysavings-frontend
    spec:
      containers:
        - name: frontend
          image: docker.io/your-dockerhub-username/smartdailysavings-frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_URL
              value: http://smartdailysavings-backend
---
apiVersion: v1
kind: Service
metadata:
  name: smartdailysavings-frontend
spec:
  selector:
    app: smartdailysavings-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: smartdailysavings-frontend
spec:
  to:
    kind: Service
    name: smartdailysavings-frontend
  port:
    targetPort: 80
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: smartdailysavings-backend
spec:
  to:
    kind: Service
    name: smartdailysavings-backend
  port:
    targetPort: 8000
