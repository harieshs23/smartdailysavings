apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartdailysavings-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartdailysavings-backend
  template:
    metadata:
      labels:
        app: smartdailysavings-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          image: ghcr.io/harieshs23/smartdailysavings-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: DATABASE_PATH
              value: /data/smartdailysavings.db
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: smartdailysavings-data
---
apiVersion: v1
kind: Service
metadata:
  name: smartdailysavings-backend
spec:
  selector:
    app: smartdailysavings-backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartdailysavings-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartdailysavings-frontend
  template:
    metadata:
      labels:
        app: smartdailysavings-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: ghcr.io/harieshs23/smartdailysavings-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: smartdailysavings-frontend
spec:
  selector:
    app: smartdailysavings-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: smartdailysavings-frontend
spec:
  to:
    kind: Service
    name: smartdailysavings-frontend
  port:
    targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smartdailysavings-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: smartdailysavings-backend
spec:
  to:
    kind: Service
    name: smartdailysavings-backend
  port:
    targetPort: http
