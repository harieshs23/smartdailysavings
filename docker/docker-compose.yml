version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartdailysavings-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartdailysavings}
      POSTGRES_USER: ${POSTGRES_USER:-smartdailysavings}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartdailysavings}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smartdailysavings-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: smartdailysavings-otel
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: smartdailysavings-backend
    depends_on:
      - postgres
      - redis
      - otel-collector
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-postgresql://smartdailysavings:smartdailysavings@postgres:5432/smartdailysavings}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai}
    volumes:
      - ../backend:/app

  frontend:
    image: nginx:alpine
    container_name: smartdailysavings-frontend
    ports:
      - "8080:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
