server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /deals {
    proxy_pass http://smartdailysavings-backend;
  }

  location /waitlist {
    proxy_pass http://smartdailysavings-backend;
  }

  location / {
    try_files $uri /index.html;
  }
}
